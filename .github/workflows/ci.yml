name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/shizoid/go.mod

      - name: Check formatting
        run: make fmt

      - name: go vet
        run: make vet

      - name: Install golangci-lint
        run: make lint-install

      - name: golangci-lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/shizoid/go.mod

      - name: Run tests (unit + dockerized integration)
        run: make test

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/shizoid/go.mod

      - name: govulncheck
        run: make vuln

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v7

      - name: Resolve short SHA
        id: version
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: build/prod/Containerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.version.outputs.short_sha }}
          tags: |
            top4ek/shizoid-go:latest
            top4ek/shizoid-go:${{ steps.version.outputs.short_sha }}
