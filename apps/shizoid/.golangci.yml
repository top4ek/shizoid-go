version: "2"

linters:
  # standard set: errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
